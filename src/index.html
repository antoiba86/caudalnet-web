<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>CaudalNet</title>
        <!-- Relative, so the app also works when served under a dynamic path
             prefix (Home Assistant ingress mounts it at /api/hassio_ingress/<token>/). -->
        <base href="./" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://primefaces.org" />
        <link rel="icon" type="image/x-icon" href="https://primefaces.org/cdn/primeng/images/favicon.png" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <script>
            // Applies the stored theme before the first paint, so a dark-theme user
            // never sees a white flash while Angular boots. LayoutService repeats
            // this once it starts; the storage key must match LayoutService.STORAGE_KEY.
            (function () {
                try {
                    var stored = localStorage.getItem('caudalnet.layout');
                    var dark = stored ? JSON.parse(stored).darkTheme : window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (dark) {
                        document.documentElement.classList.add('app-dark');
                    }
                } catch (e) {
                    // Storage unavailable — fall through to the default light theme.
                }
            })();
        </script>
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
